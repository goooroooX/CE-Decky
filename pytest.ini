[pytest]
addopts = -q
testpaths = tests
pythonpath = . py_modules
markers =
    live_provider: opt-in tests that read live provider pages and download public table artifacts
    direct_provider: opt-in tests that require direct artifact acquisition without browser or file-picker fallback
    denies_access: the test takes a permission away and needs this process to be refused; skipped where nothing can be refused to it, as for root

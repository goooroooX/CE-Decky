name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: pnpm

      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          pnpm install --frozen-lockfile

      - name: Validate tag, version, and changelog
        run: python scripts/check_release.py --tag "${GITHUB_REF_NAME}"

      - name: Run release validation and build archives
        run: python scripts/qa.py --profile release

      - name: Write release checksums
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          (cd artifacts && sha256sum "CE-Decky-v${version}.zip" > SHA256SUMS)

      - name: Attest release archives
        uses: actions/attest@v4
        with:
          subject-path: artifacts/*.zip

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "${GITHUB_REF_NAME#v}" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            artifacts/*.zip artifacts/SHA256SUMS \
            --verify-tag --generate-notes "${prerelease[@]}"

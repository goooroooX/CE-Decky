name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: pnpm

      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          pnpm install --frozen-lockfile

      - name: Validate tag, version, and changelog
        run: python scripts/check_release.py --tag "${GITHUB_REF_NAME}"

      - name: Run release validation and build archives
        run: python scripts/qa.py --profile release

      - name: Set up Python 3.14 for focused compatibility checks
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Restore Python compatibility-test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Fetch the reviewed supported Decky executable
        run: |
          python scripts/decky_compat_monitor.py fetch-pin --output build/decky-runtime/PluginLoader
          python scripts/decky_compat_monitor.py fetch-pin --baseline --output build/decky-runtime/previous-PluginLoader

      - name: Verify the exact release package in the actual Decky runtime
        env:
          CE_DECKY_COMPAT_PLUGIN_DIR: artifacts
          CE_DECKY_COMPAT_RUNTIME: build/decky-runtime/PluginLoader
          CE_DECKY_REQUIRE_FROZEN: "1"
          CE_DECKY_COMPAT_BASELINE_RUNTIME: build/decky-runtime/previous-PluginLoader
        run: >-
          python scripts/qa.py
          --pytest tests/test_runtime_compat.py
          --pytest tests/test_runtime_state_access.py
          --pytest tests/test_network_prod.py
          --pytest tests/test_decky_compat_probe.py

      - name: Write release checksums
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          (cd artifacts && sha256sum "CE-Decky-v${version}.zip" > SHA256SUMS)

      - name: Attest release archives
        uses: actions/attest@v4
        with:
          subject-path: artifacts/*.zip

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "${GITHUB_REF_NAME#v}" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          # The description is the reviewed file this tag points at, with
          # GitHub's own commit list under it. Built here rather than passed as
          # two flags so the body that is published is one file this step can be
          # read against.
          notes="docs/release-notes/${GITHUB_REF_NAME}.md"
          cp "$notes" release-body.md
          printf '\n' >> release-body.md
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" -q .body >> release-body.md
          # The title is the tag, set here: a release published without one is
          # shown under a title GitHub makes up, which for v0.9.30 was the
          # subject of an unrelated CI commit the tag happened to point at.
          gh release create "$GITHUB_REF_NAME" \
            artifacts/*.zip artifacts/SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --verify-tag --notes-file release-body.md "${prerelease[@]}"

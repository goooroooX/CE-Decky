name: CE Decky - Decky compatibility - action required on failure

# Whether the latest published CE Decky release still works in Decky's latest
# stable release and newest prerelease. Each new pair of exact artifacts is
# tested once; a failed run means a new problem, and STATUS.md on the ledger
# branch is the current answer. docs/DEVELOPMENT.md is the procedure.

on:
  schedule:
    # Daily. A run with no new pair costs a handful of API reads.
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      initialize:
        description: "First activation only: create the empty ledger branch"
        type: boolean
        default: false
      retest:
        description: "Test again: 'current' for every current pair, or one pair key from STATUS.md"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: decky-compatibility-monitor
  cancel-in-progress: false

jobs:
  discover:
    # The timer runs only once the watch is switched on; a run started by hand
    # always runs, so the whole chain can be checked before it is.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.DECKY_COMPAT_MONITOR_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      attestations: read
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      has_work: ${{ steps.discover.outputs.has_work }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Create the empty ledger branch
        if: inputs.initialize == true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/decky_compat_monitor.py initialize
      - name: Find the pairs that have not been tested
        id: discover
        if: inputs.initialize != true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RETEST: ${{ inputs.retest }}
        run: python scripts/decky_compat_monitor.py discover

  probe:
    needs: discover
    if: needs.discover.outputs.has_work == 'true'
    name: probe (Decky ${{ matrix.pair.decky.tag }} × CE Decky ${{ matrix.pair.plugin.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Unreviewed Decky executables run here: no write permission, no token.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        pair: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - name: Check out the monitor
        uses: actions/checkout@v7
        with:
          path: coordinator
          persist-credentials: false
      - name: Check out the release under test, whose own probe tests it
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.pair.plugin.tag }}
          path: release
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Test this pair beside its pinned control
        env:
          PAIR: ${{ toJSON(matrix.pair) }}
        run: python coordinator/scripts/decky_compat_monitor.py probe --release-tree release --output build/decky-monitor/result.json
      - name: Keep the result for the recorder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decky-compatibility-result-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
          path: build/decky-monitor/result.json
          retention-days: 7
          if-no-files-found: warn

  record:
    needs: [discover, probe]
    # Runs after failed probes too, which are the results worth keeping; a run
    # someone cancelled writes nothing.
    if: ${{ !cancelled() && needs.discover.result == 'success' && inputs.initialize != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        if: needs.discover.outputs.has_work == 'true'
        # A pair without a result stays untested and is asked for again.
        continue-on-error: true
        with:
          pattern: decky-compatibility-result-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: build/decky-monitor/results
      - name: Save results and publish STATUS.md
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PLAN: ${{ needs.discover.outputs.matrix }}
        run: python scripts/decky_compat_monitor.py record --results build/decky-monitor/results

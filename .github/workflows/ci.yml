name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Pack exact source snapshot
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p artifacts
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git archive \
            --format=zip \
            --output="artifacts/CE-Decky-source-${SOURCE_SHA}.zip" \
            "$SOURCE_SHA"

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ce-decky-source-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/CE-Decky-source-${{ github.event.pull_request.head.sha || github.sha }}.zip
          retention-days: 1
          if-no-files-found: error
          compression-level: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: pnpm

      - name: Install Lua for resident-bridge conformance
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lua5.4

      - name: Install test and build dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          pnpm install --frozen-lockfile

      - name: Run release-equivalent validation and packaging
        run: python scripts/qa.py --profile release

  store-artifact:
    # The official Decky Store builds a different archive than `release` packages,
    # and the failures that are specific to it are invisible to every other job.
    # Docker is present on the hosted runner, which is the engine the plugin
    # database itself uses.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build and check the Store artifact
        # Under docker the builder container writes /out as root, and the CLI
        # then cannot read back what it is meant to zip. `decky-plugin-database`
        # solves this by running the whole CLI as root and giving the tree back
        # afterwards, and this is that, so the two builds fail and pass alike.
        run: |
          sudo "$(which python)" scripts/check_store_artifact.py --build
          sudo chown -R "$(whoami)" build

      - name: Upload the Store artifact
        uses: actions/upload-artifact@v4
        with:
          name: ce-decky-store-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/decky-store/*.zip
          retention-days: 1
          if-no-files-found: error

name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Pack exact source snapshot
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p artifacts
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git archive \
            --format=zip \
            --output="artifacts/CE-Decky-source-${SOURCE_SHA}.zip" \
            "$SOURCE_SHA"

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ce-decky-source-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/CE-Decky-source-${{ github.event.pull_request.head.sha || github.sha }}.zip
          retention-days: 1
          if-no-files-found: error
          compression-level: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: pnpm

      - name: Install Lua for resident-bridge conformance
        # The runner's package mirrors have stopped resolving for minutes at a
        # time, which failed the whole gate before any test ran. Retried with
        # growing pauses, and still a failure once every attempt has failed,
        # because the bridge conformance suite skips rather than fails without
        # Lua and a green run would then prove less than it says.
        timeout-minutes: 20
        run: |
          for attempt in 1 2 3 4 5; do
            if sudo apt-get -o Acquire::Retries=3 update \
              && sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends lua5.4; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "Lua install attempt $attempt failed; retrying in $((attempt * 30))s"
              sleep $((attempt * 30))
            fi
          done
          echo "::error::lua5.4 could not be installed after 5 attempts"
          exit 1

      - name: Install test and build dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          pnpm install --frozen-lockfile

      - name: Run release-equivalent validation and packaging
        run: python scripts/qa.py --profile release

      - name: Share this exact package with the Decky runtime check
        uses: actions/upload-artifact@v4
        with:
          name: ce-decky-runtime-input-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/CE-Decky-v*.zip
          retention-days: 1
          if-no-files-found: error

  decky-runtime:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/download-artifact@v4
        with:
          name: ce-decky-runtime-input-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts
      - name: Restore only Python test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Fetch the reviewed supported Decky executable
        run: |
          python scripts/decky_compat_monitor.py fetch-pin --output build/decky-runtime/PluginLoader
          python scripts/decky_compat_monitor.py fetch-pin --baseline --output build/decky-runtime/previous-PluginLoader
      - name: Check Python 3.14 behavior and the actual frozen Decky package
        env:
          CE_DECKY_COMPAT_PLUGIN_DIR: artifacts
          CE_DECKY_COMPAT_RUNTIME: build/decky-runtime/PluginLoader
          CE_DECKY_REQUIRE_FROZEN: "1"
          CE_DECKY_COMPAT_BASELINE_RUNTIME: build/decky-runtime/previous-PluginLoader
        run: >-
          python scripts/qa.py
          --pytest tests/test_runtime_compat.py
          --pytest tests/test_runtime_state_access.py
          --pytest tests/test_network_prod.py
          --pytest tests/test_decky_compat_probe.py

  store-artifact:
    # The official Decky Store builds a different archive than `release` packages,
    # and the failures that are specific to it are invisible to every other job.
    # Docker is present on the hosted runner, which is the engine the plugin
    # database itself uses.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build and check the Store artifact
        # Under docker the builder container writes /out as root, and the CLI
        # then cannot read back what it is meant to zip. `decky-plugin-database`
        # solves this by running the whole CLI as root and giving the tree back
        # afterwards, and this is that, so the two builds fail and pass alike.
        run: |
          sudo "$(which python)" scripts/check_store_artifact.py --build
          sudo chown -R "$(whoami)" build

      - name: Upload the Store artifact
        uses: actions/upload-artifact@v4
        with:
          name: ce-decky-store-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/decky-store/*.zip
          retention-days: 1
          if-no-files-found: error

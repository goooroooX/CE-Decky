name: README badges

# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
# If github-pages restricts deployment refs, allow main and release tags v*.
# First/manual refresh: gh workflow run readme-badges.yml --ref main
# Shields may cache downloads.json for an hour after a successful deployment.
on:
  schedule:
    - cron: "17 6 * * *"
  release:
    types: [published]
  workflow_dispatch:
  # Release publishes with GITHUB_TOKEN, so its release event cannot start
  # another workflow. Its successful completion can, without changing it.
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions: {}

concurrency:
  group: readme-badges-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Count plugin ZIP downloads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > releases.json
          python3 - <<'PY'
          import fnmatch
          import json
          from pathlib import Path

          total = 0
          pages = json.loads(Path("releases.json").read_text(encoding="utf-8"))
          if not isinstance(pages, list):
              raise ValueError("the release pages are not a list")
          for releases in pages:
              if not isinstance(releases, list):
                  raise ValueError("a release page is not a list")
              for release in releases:
                  if release["draft"] or release["published_at"] is None:
                      continue
                  for asset in release["assets"]:
                      if not fnmatch.fnmatchcase(asset["name"], "CE-Decky-v*.zip"):
                          continue
                      count = asset["download_count"]
                      if type(count) is not int or count < 0:
                          raise ValueError("a ZIP download count is not a nonnegative integer")
                      total += count
          badge = {"schemaVersion": 1, "label": "Downloads", "message": str(total), "color": "blue"}
          output = Path("_site")
          output.mkdir(exist_ok=True)
          (output / "downloads.json").write_text(json.dumps(badge, separators=(",", ":")) + "\n", encoding="utf-8")
          print(f"Plugin ZIP downloads: {total}")
          PY
      - name: Upload badge data
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Deploy badge data
        id: deployment
        uses: actions/deploy-pages@v5
